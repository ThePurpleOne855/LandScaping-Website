<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SanCorporation — Lawn & Garden Care · Kissimmee, FL</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Serif+Display:ital@0;1&family=Bitter:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper: #f1e6cc;
    --paper-2: #e8d9b6;
    --ink: #1a1612;
    --forest: #1f3d2b;
    --forest-2: #15291d;
    --brick: #b5482e;
    --gold: #c8a24c;
    --sky: #6f9bb3;
    --grit: rgba(26, 22, 18, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Bitter", Georgia, serif;
    color: var(--ink);
    background: var(--paper);
    overflow-x: hidden;
    line-height: 1.55;
  }

  /* paper grain layered globally */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.04) 0 1px, transparent 2px),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,0.05) 0 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.03) 0 1px, transparent 2px);
    background-size: 7px 7px, 11px 11px, 5px 5px;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 998;
    opacity: 0.18;
    background:
      repeating-linear-gradient(0deg, rgba(26,22,18,0.05) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  ::selection { background: var(--gold); color: var(--ink); }

  .display { font-family: "Alfa Slab One", "Bitter", serif; font-weight: 400; letter-spacing: 0.01em; line-height: 0.95; }
  .editorial { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  /* halftone helper */
  .halftone {
    background-image: radial-gradient(currentColor 22%, transparent 23%);
    background-size: 6px 6px;
  }

  @keyframes ticker { from { transform: translateX(0) } to { transform: translateX(-50%) } }

  /* ── Responsive ─────────────────────────────────────────────── */

  /* Tablet & below (≤1024px) */
  @media (max-width: 1024px) {
    .services-grid-compact { grid-template-columns: repeat(2, 1fr) !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
  }

  /* Mobile (≤768px) */
  @media (max-width: 768px) {
    /* TopBar */
    .topbar-link    { display: none !important; }
    .topbar-tagline { display: none !important; }
    .topbar-name    { font-size: 15px !important; }
    .topbar-nav     { gap: 10px !important; }
    .topbar-phone   { font-size: 13px !important; padding: 8px 10px !important; }

    /* Hero */
    .hero-inner {
      grid-template-columns: 1fr !important;
      padding: 44px 20px 56px !important;
      gap: 0 !important;
    }
    .hero-right { display: none !important; }
    .hero-sub   { font-size: 18px !important; }
    .hero-cta   { margin-top: 28px !important; gap: 20px !important; }

    /* Trust strip */
    .trust-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 20px !important;
      padding: 24px 20px !important;
    }

    /* Services */
    .services-section { padding: 56px 0 44px !important; }
    .services-inner   { padding: 0 20px !important; }
    .services-grid    { grid-template-columns: 1fr !important; gap: 20px !important; }

    /* Process */
    .process-section  { padding: 48px 0 !important; }
    .process-inner    { padding: 0 20px !important; }
    .process-grid     { grid-template-columns: repeat(2, 1fr) !important; gap: 28px 20px !important; }
    .process-connector { display: none !important; }

    /* Big call */
    .bigcall-section { padding: 64px 0 72px !important; }
    .bigcall-inner   { padding: 0 20px !important; }

    /* Footer */
    .footer-inner { padding: 0 20px !important; }
    .footer-grid  { grid-template-columns: 1fr 1fr !important; gap: 28px !important; margin-bottom: 32px !important; }
  }

  /* Small mobile (≤480px) */
  @media (max-width: 480px) {
    .process-grid { grid-template-columns: 1fr !important; }
    .footer-grid  { grid-template-columns: 1fr !important; }
  }
</style>
</head>
