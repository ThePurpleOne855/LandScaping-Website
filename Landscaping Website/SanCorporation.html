<style>
  :root {
    --paper: #f1e6cc;
    --paper-2: #e8d9b6;
    --ink: #1a1612;
    --forest: #1f3d2b;
    --forest-2: #15291d;
    --brick: #b5482e;
    --gold: #c8a24c;
    --sky: #6f9bb3;
    --grit: rgba(26, 22, 18, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Bitter", Georgia, serif;
    color: var(--ink);
    background: var(--paper);
    overflow-x: hidden;
    line-height: 1.55;
  }

  /* paper grain layered globally */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.04) 0 1px, transparent 2px),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,0.05) 0 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.03) 0 1px, transparent 2px);
    background-size: 7px 7px, 11px 11px, 5px 5px;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 998;
    opacity: 0.18;
    background:
      repeating-linear-gradient(0deg, rgba(26,22,18,0.05) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  ::selection { background: var(--gold); color: var(--ink); }

  .display { font-family: "Alfa Slab One", "Bitter", serif; font-weight: 400; letter-spacing: 0.01em; line-height: 0.95; }
  .editorial { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  /* halftone helper */
  .halftone {
    background-image: radial-gradient(currentColor 22%, transparent 23%);
    background-size: 6px 6px;
  }
</style>
</head>
